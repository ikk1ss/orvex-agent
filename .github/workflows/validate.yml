name: Validate ORVEX Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML structure and application JavaScript
        run: node scripts/validate-site.mjs
      - name: Test Telegram authentication
        run: node --test scripts/backend-auth.test.cjs scripts/health-api.test.cjs scripts/session-api.test.cjs scripts/profile-api.test.cjs scripts/memory-api.test.cjs scripts/account-api.test.cjs scripts/personalization-context.test.cjs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Python Telegram bot
        run: |
          python -m py_compile telegram_bot/config.py telegram_bot/messages.py telegram_bot/bot.py
          python -m unittest discover -s telegram_bot/tests -v
