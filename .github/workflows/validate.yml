name: Validate ORVEX Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML structure and application JavaScript
        run: node scripts/validate-site.mjs
      - name: Test Telegram authentication
        run: node --test scripts/backend-auth.test.cjs scripts/memory-api.test.cjs
